name: Update packages
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  update-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      checks: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Download code from repository
        uses: actions/checkout@v7
      
      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: '12'
          runtime: node@26
          cache: true

      - name: Set NodeJS
        uses: actions/setup-node@v7
        with:
            node-version: '26'
            cache: 'pnpm'
            package-manager-cache: true

      - name: Update dependencies
        run: pnpm update

      - name: Install Dependencies
        run: pnpm i
      
      - name: Prepare environment file
        run: cp -r .env.example .env
      
      - name: Push database
        run: pnpm run db:generate && pnpm run db:migrate
      
      - name: Build application
        run: pnpm run build

      - name: Install Dependencies
        run: pnpm i
      
      - name: Run Unit Tests
        run: pnpm run test
      
      - name: Running Tests E2E
        run: pnpm run test:e2e
      
      - name: Run Test Coverage
        run: pnpm run test:cov

      - name: Delete .env file
        if: always()
        run: rm -f .env
      
      - name: Create pull request with updates
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(deps): weekly packages update'
          title: 'chore(deps): weekly packages update'
          branch: chore/weekly-deps-update
          delete-branch: true
      
